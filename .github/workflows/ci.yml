name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build, test, coverage (JUnit 5, JaCoCo)
        run: mvn -B clean verify
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up --build -d
      - name: Wait for healthy and exercise the API
        run: |
          for i in $(seq 1 40); do
            curl -sf localhost:8080/healthz && break || sleep 2
          done
          curl -sf -X POST localhost:8080/v1/processes -d '{"processId":"ci-1","processType":"smoke"}'
          curl -sf -X POST localhost:8080/v1/processes/ci-1/pause
          curl -sf localhost:8080/v1/processes/ci-1 | grep PAUSED
      - name: Process survives a container restart (RocksDB volume)
        run: |
          docker compose restart process-engine
          for i in $(seq 1 40); do curl -sf localhost:8080/healthz && break || sleep 2; done
          curl -sf localhost:8080/v1/processes/ci-1 | grep PAUSED
      - name: Tear down
        if: always()
        run: docker compose down -v
